<text x="996" y="661" fill="#64748B" font-size="11" text-anchor="middle">下一轮开工读的是项目里的副本，不是技能目录里的原件</text>
<text x="32" y="774" fill="#64748B" font-size="11">术语：会话 ＝ 客户端一个对话窗口　・　回合 ＝ 会话内一次发话应答　・　阶段 ＝ 项目推进的一段，可跨多个会话</text>
