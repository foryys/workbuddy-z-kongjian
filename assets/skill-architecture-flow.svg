<text x="70" y="211" fill="#64748B" font-size="11">说人话就行，怎么顺口怎么说</text>
<rect x="56" y="238" width="312" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="70" y="262" fill="#0F172A" font-size="13" font-weight="600">启动项目 ／ 接手项目</text>
